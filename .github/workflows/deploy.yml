name: Deploy su Hostinger

# Costruisce il CSS con Tailwind e carica il contenuto di ./public dentro la cartella
# public_html già esistente su Hostinger.
# Il deploy è incrementale: l'action tiene sul server un file di stato
# (.ftp-deploy-sync-state.json) e a ogni run carica solo i file nuovi o modificati
# ed elimina solo quelli che lei stessa aveva caricato e che sono stati rimossi dalla repo.
# Tutto ciò che c'è già in public_html e non proviene dalla repo non viene toccato.

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prova a vuoto: mostra cosa verrebbe caricato senza modificare il server"
        type: boolean
        default: false

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build del CSS (Tailwind)
        run: |
          npm ci
          npm run build

      - name: Sync incrementale via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./public/
          server-dir: public_html/
          # Mai svuotare public_html prima del caricamento.
          dangerous-clean-slate: false
          dry-run: ${{ inputs.dry_run || false }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/desktop.ini
